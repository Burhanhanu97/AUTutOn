<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTutOn - By @Burhanhanu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        (function() {
            const { useState, useEffect, useMemo } = React;
            
            const App = () => {
                const [activeSession, setActiveSession] = useState(1);
                const [topic, setTopic] = useState('');
                const [bulkText, setBulkText] = useState('');
                const [isProcessing, setIsProcessing] = useState(false);
                const [error, setError] = useState(null);
                const [copiedId, setCopiedId] = useState(null);
                
                const [sessionsData, setSessionsData] = useState({
                    1: { topic: '', results: [] },
                    2: { topic: '', results: [] },
                    3: { topic: '', results: [] },
                    4: { topic: '', results: [] },
                    5: { topic: '', results: [] },
                    6: { topic: '', results: [] },
                    7: { topic: '', results: [] },
                    8: { topic: '', results: [] },
                });

                // Akses ikon dari window.lucideReact secara aman
                const Icons = window.lucideReact || {};
                const { 
                    MessageSquare, History, Send, Trash2, User, 
                    CheckCircle, AlertCircle, Clock, BookOpen, 
                    Sparkles, Copy, Check, ChevronRight 
                } = Icons;

                const currentSession = sessionsData[activeSession];

                const handleCopy = (text, id) => {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        setCopiedId(id);
                        setTimeout(() => setCopiedId(null), 2000);
                    } catch (err) {
                        console.error('Gagal menyalin teks', err);
                    }
                    document.body.removeChild(textArea);
                };

                const callGemini = async (prompt) => {
                    const apiKey = ""; // Kunci akan disediakan oleh environment
                    let retries = 0;
                    const maxRetries = 5;
                    
                    while (retries <= maxRetries) {
                        try {
                            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    contents: [{ parts: [{ text: prompt }] }],
                                    generationConfig: {
                                        responseMimeType: "application/json",
                                        responseSchema: {
                                            type: "OBJECT",
                                            properties: {
                                                students: {
                                                    type: "ARRAY",
                                                    items: {
                                                        type: "OBJECT",
                                                        properties: {
                                                            name: { type: "STRING" },
                                                            originalAnswer: { type: "STRING" },
                                                            score: { type: "NUMBER" },
                                                            feedback: { type: "STRING" },
                                                            isPlagiarized: { type: "BOOLEAN" },
                                                            hasSource: { type: "BOOLEAN" },
                                                            isOffTopic: { type: "BOOLEAN" }
                                                        },
                                                        required: ["name", "originalAnswer", "score", "feedback"]
                                                    }
                                                }
                                            }
                                        }
                                    }
                                })
                            });

                            if (!response.ok) throw new Error('API Error');
                            const data = await response.json();
                            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                            return JSON.parse(text);
                        } catch (err) {
                            if (retries === maxRetries) throw err;
                            const delay = Math.pow(2, retries) * 1000;
                            await new Promise(resolve => setTimeout(resolve, delay));
                            retries++;
                        }
                    }
                };

                const processDiscussion = async () => {
                    if (!topic.trim() || !bulkText.trim()) {
                        setError("Mohon masukkan topik dan teks diskusi mahasiswa.");
                        return;
                    }

                    setIsProcessing(true);
                    setError(null);

                    const prompt = `
                        Anda adalah Tutor Universitas Terbuka (Tuton).
                        Tugas: Memproses teks diskusi mahasiswa secara bulk dan berikan penilaian serta feedback.
                        
                        Topik Diskusi: "${topic}"
                        
                        Teks Diskusi:
                        ${bulkText}

                        Instruksi Penilaian & Feedback (SANGAT PENTING):
                        1. Identifikasi nama mahasiswa (panggil dengan nama singkat saja) dan jawaban mereka.
                        2. Kriteria Nilai:
                           - Jawaban mirip/sama dengan teman sebelumnya: Nilai 0 (Plagiasi).
                           - Tidak nyambung topik: Nilai 10.
                           - Relevan: Nilai 80-100.
                           - Ada sumber referensi: Nilai lebih tinggi (95-100).
                        3. Aturan Struktur Feedback:
                           - DILARANG memberikan sapaan waktu (pagi/siang/malam).
                           - DILARANG menyapa nama mahasiswa di awal kalimat.
                           - LANGSUNG mulai dengan komentar mengenai jawaban mereka.
                           - Masukkan sapaan "Mas [Nama]", "Mbak [Nama]", atau "Saudara [Nama]" di TENGAH atau AKHIR kalimat secara mengalir.
                           - DILARANG menggunakan kata "Anda". Ganti setiap kata "Anda" menjadi "Saudara".
                           - Jika ada salam (seperti Assalamualaikum) dari mahasiswa, balaslah secara natural di dalam isi feedback.
                           - Bahasa santai, ramah, profesional, mudah dipahami, kurangi istilah sulit.
                           - Maksimal 200 kata per feedback.
                           - Akhiri dengan kalimat motivasi singkat.
                        
                        Output dalam format JSON.
                    `;

                    try {
                        const result = await callGemini(prompt);
                        if (result && result.students) {
                            const resultsWithIds = result.students.map(s => ({ ...s, id: self.crypto.randomUUID() }));
                            setSessionsData(prev => ({
                                ...prev,
                                [activeSession]: {
                                    topic: topic,
                                    results: [...resultsWithIds, ...prev[activeSession].results]
                                }
                            }));
                            setBulkText('');
                        }
                    } catch (err) {
                        setError("Gagal memproses data. Silakan coba lagi.");
                        console.error(err);
                    } finally {
                        setIsProcessing(false);
                    }
                };

                const deleteResult = (id) => {
                    const updatedResults = currentSession.results.filter(item => item.id !== id);
                    setSessionsData(prev => ({
                        ...prev,
                        [activeSession]: { ...prev[activeSession], results: updatedResults }
                    }));
                };

                return (
                    <div className="flex h-screen bg-slate-50 overflow-hidden">
                        {/* Sidebar */}
                        <aside className="w-80 bg-blue-900 text-white flex flex-col shadow-2xl z-20">
                            <div className="p-8 border-b border-blue-800/50">
                                <div className="flex items-center gap-3">
                                    <div className="p-2 bg-yellow-400 rounded-lg shadow-lg shadow-yellow-400/20">
                                        {Sparkles && <Sparkles size={24} className="text-blue-900" />}
                                    </div>
                                    <h1 className="text-2xl font-black tracking-tight">AUTutOn</h1>
                                </div>
                                <p className="text-[10px] text-blue-300 mt-2 font-medium tracking-widest uppercase opacity-70">by @Burhanhanu</p>
                            </div>
                            
                            <nav className="flex-1 overflow-y-auto py-6 custom-scrollbar">
                                <p className="px-8 text-[10px] font-bold text-blue-400 uppercase tracking-widest mb-4">Modul Diskusi</p>
                                {[1, 2, 3, 4, 5, 6, 7, 8].map((num) => (
                                    <button
                                        key={num}
                                        onClick={() => setActiveSession(num)}
                                        className={`w-full flex items-center gap-4 px-8 py-4 transition-all relative ${
                                            activeSession === num 
                                            ? 'bg-blue-800/50 text-white font-bold' 
                                            : 'text-blue-200 hover:bg-blue-800/30'
                                        }`}
                                    >
                                        {activeSession === num && <div className="absolute left-0 top-0 bottom-0 w-1 bg-yellow-400" />}
                                        <div className={`p-1.5 rounded ${activeSession === num ? 'bg-blue-600' : 'bg-blue-800'}`}>
                                            {MessageSquare && <MessageSquare size={16} />}
                                        </div>
                                        <span className="text-sm">Diskusi Sesi {num}</span>
                                        {sessionsData[num].results.length > 0 && (
                                            <span className="ml-auto bg-blue-500/50 text-[10px] px-2 py-0.5 rounded-full border border-blue-400/30">
                                                {sessionsData[num].results.length}
                                            </span>
                                        )}
                                    </button>
                                ))}
                            </nav>

                            <div className="p-6 bg-blue-950/50 border-t border-blue-800/50">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-full bg-blue-800 border border-blue-700 flex items-center justify-center">
                                        {User && <User size={20} className="text-blue-300" />}
                                    </div>
                                    <div>
                                        <p className="text-xs font-bold text-white">Tutor UT</p>
                                        <p className="text-[10px] text-blue-400">Panel Penilaian</p>
                                    </div>
                                </div>
                            </div>
                        </aside>

                        {/* Main Content */}
                        <main className="flex-1 flex flex-col min-w-0 bg-slate-50 overflow-hidden">
                            <header className="bg-white border-b border-slate-200 p-6 flex justify-between items-center shadow-sm z-10">
                                <div>
                                    <h2 className="text-xl font-extrabold text-blue-950 flex items-center gap-2">
                                        {MessageSquare && <MessageSquare className="text-blue-600" size={20} />}
                                        Ruang Diskusi Sesi {activeSession}
                                    </h2>
                                    <p className="text-xs text-slate-500 mt-0.5 font-medium">Otomatisasi Penilaian & Feedback Mahasiswa</p>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="h-2 w-2 rounded-full bg-green-500 animate-pulse"></div>
                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Sistem Aktif</span>
                                </div>
                            </header>

                            <div className="flex-1 overflow-y-auto p-8 custom-scrollbar">
                                <div className="max-w-6xl mx-auto space-y-8">
                                    
                                    {/* Input Area */}
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                        <div className="space-y-3">
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-widest flex items-center gap-2">
                                                {BookOpen && <BookOpen size={14} className="text-blue-600" />} Topik Diskusi
                                            </label>
                                            <div className="relative group">
                                                <textarea
                                                    className="w-full p-5 bg-white border border-slate-200 rounded-2xl shadow-sm focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all min-h-[160px] text-sm leading-relaxed"
                                                    placeholder="Tempelkan pertanyaan atau topik diskusi utama di sini..."
                                                    value={topic}
                                                    onChange={(e) => setTopic(e.target.value)}
                                                />
                                                <div className="absolute top-4 right-4 text-slate-300 opacity-0 group-hover:opacity-100 transition-opacity">
                                                    {Sparkles && <Sparkles size={20} />}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="space-y-3">
                                            <label className="text-xs font-bold text-slate-500 uppercase tracking-widest flex items-center gap-2">
                                                {MessageSquare && <MessageSquare size={14} className="text-blue-600" />} Bulk Teks Mahasiswa
                                            </label>
                                            <textarea
                                                className="w-full p-5 bg-white border border-slate-200 rounded-2xl shadow-sm focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all min-h-[160px] text-sm leading-relaxed"
                                                placeholder="Tempelkan semua jawaban mahasiswa sekaligus..."
                                                value={bulkText}
                                                onChange={(e) => setBulkText(e.target.value)}
                                            />
                                        </div>
                                    </div>

                                    {error && (
                                        <div className="p-4 bg-red-50 border border-red-100 text-red-600 rounded-xl flex items-center gap-3 text-sm font-medium animate-bounce">
                                            {AlertCircle && <AlertCircle size={18} />} {error}
                                        </div>
                                    )}

                                    <div className="flex justify-center pt-2">
                                        <button
                                            onClick={processDiscussion}
                                            disabled={isProcessing}
                                            className={`group relative flex items-center gap-3 px-12 py-4 rounded-full font-black text-sm uppercase tracking-widest transition-all shadow-xl active:scale-95 ${
                                                isProcessing 
                                                ? 'bg-slate-200 text-slate-400 cursor-not-allowed' 
                                                : 'bg-blue-600 hover:bg-blue-700 text-white shadow-blue-200'
                                            }`}
                                        >
                                            {isProcessing ? (
                                                <>
                                                    <div className="w-5 h-5 border-3 border-slate-300 border-t-slate-500 rounded-full animate-spin"></div>
                                                    Menganalisis Jawaban...
                                                </>
                                            ) : (
                                                <>
                                                    Mulai Penilaian Otomatis
                                                    {ChevronRight && <ChevronRight size={18} className="group-hover:translate-x-1 transition-transform" />}
                                                </>
                                            )}
                                        </button>
                                    </div>

                                    {/* Results History */}
                                    <div className="space-y-6 pt-6">
                                        <div className="flex items-center justify-between border-b border-slate-200 pb-4">
                                            <h3 className="text-lg font-black text-blue-950 flex items-center gap-3">
                                                {History && <History size={22} className="text-blue-600" />} Riwayat Penilaian Mahasiswa
                                            </h3>
                                            <div className="flex gap-2">
                                                <span className="text-[10px] font-bold bg-blue-100 text-blue-700 px-4 py-1.5 rounded-full uppercase tracking-widest">
                                                    Sesi {activeSession}
                                                </span>
                                                <span className="text-[10px] font-bold bg-slate-100 text-slate-600 px-4 py-1.5 rounded-full uppercase tracking-widest">
                                                    {currentSession.results.length} Mahasiswa
                                                </span>
                                            </div>
                                        </div>

                                        {currentSession.results.length === 0 ? (
                                            <div className="bg-white border border-slate-200 rounded-3xl p-20 text-center shadow-sm">
                                                <div className="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-6">
                                                    {Clock && <Clock size={40} className="text-slate-200" />}
                                                </div>
                                                <h4 className="text-slate-500 font-bold">Belum ada data penilaian</h4>
                                                <p className="text-sm text-slate-400 mt-2">Silakan masukkan topik dan jawaban mahasiswa di atas untuk memulai.</p>
                                            </div>
                                        ) : (
                                            <div className="grid grid-cols-1 gap-6">
                                                {currentSession.results.map((item) => (
                                                    <div key={item.id} className="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-xl hover:border-blue-200 transition-all duration-300 group">
                                                        <div className="p-8 flex flex-col md:flex-row gap-8">
                                                            {/* Left: Score Card */}
                                                            <div className="md:w-56 space-y-4">
                                                                <div className="flex items-center gap-3">
                                                                    <div className="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-lg shadow-blue-200">
                                                                        {item.name.charAt(0)}
                                                                    </div>
                                                                    <div className="min-w-0">
                                                                        <p className="font-black text-blue-950 truncate text-lg leading-tight">{item.name}</p>
                                                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Mahasiswa</p>
                                                                    </div>
                                                                </div>
                                                                
                                                                <div className="bg-slate-50 rounded-2xl p-5 text-center border border-slate-100 group-hover:bg-blue-50/50 group-hover:border-blue-100 transition-colors">
                                                                    <p className="text-[10px] text-slate-500 font-black mb-2 uppercase tracking-widest">Nilai Akhir</p>
                                                                    <p className={`text-5xl font-black ${item.score === 0 ? 'text-red-500' : 'text-blue-900'}`}>
                                                                        {item.score}
                                                                    </p>
                                                                </div>

                                                                <div className="flex flex-wrap gap-2">
                                                                    {item.isPlagiarized && <span className="text-[10px] px-3 py-1 bg-red-100 text-red-600 rounded-full font-black uppercase tracking-tighter">PLAGIASI</span>}
                                                                    {item.hasSource && <span className="text-[10px] px-3 py-1 bg-green-100 text-green-600 rounded-full font-black uppercase tracking-tighter">REFERENSI</span>}
                                                                    {item.isOffTopic && <span className="text-[10px] px-3 py-1 bg-yellow-100 text-yellow-700 rounded-full font-black uppercase tracking-tighter">OOT</span>}
                                                                </div>
                                                            </div>

                                                            {/* Right: Feedback & Controls */}
                                                            <div className="flex-1 space-y-5">
                                                                <div className="flex items-center justify-between">
                                                                    <div className="flex items-center gap-2 px-3 py-1.5 bg-blue-50 rounded-lg text-blue-700 font-black text-[10px] uppercase tracking-widest">
                                                                        {CheckCircle && <CheckCircle size={14} />} Feedback Tutor
                                                                    </div>
                                                                    <button 
                                                                        onClick={() => handleCopy(item.feedback, item.id)}
                                                                        className={`flex items-center gap-2 px-6 py-2.5 rounded-full text-xs font-black transition-all shadow-md active:scale-95 ${
                                                                            copiedId === item.id 
                                                                            ? 'bg-green-500 text-white' 
                                                                            : 'bg-blue-600 text-white hover:bg-blue-700'
                                                                        }`}
                                                                    >
                                                                        {copiedId === item.id ? (
                                                                            <>{Check && <Check size={16} />} Tersalin!</>
                                                                        ) : (
                                                                            <>{Copy && <Copy size={16} />} Salin Feedback</>
                                                                        )}
                                                                    </button>
                                                                </div>
                                                                
                                                                <div className="p-6 bg-slate-50 rounded-2xl border border-slate-100 text-sm text-slate-700 leading-relaxed font-medium relative italic group-hover:bg-white group-hover:shadow-inner transition-all">
                                                                    "{item.feedback}"
                                                                    <div className="absolute -bottom-2 -right-2 text-slate-200/50 group-hover:text-blue-100 transition-colors pointer-events-none">
                                                                        {MessageSquare && <MessageSquare size={80} fill="currentColor" />}
                                                                    </div>
                                                                </div>

                                                                <div className="pt-4 flex justify-between items-center border-t border-slate-100">
                                                                    <p className="text-[10px] text-slate-400 font-medium italic">Klik "Salin Feedback" untuk memasukkan ke aplikasi Tuton UT.</p>
                                                                    <button 
                                                                        onClick={() => deleteResult(item.id)}
                                                                        className="p-2 text-slate-300 hover:text-red-500 transition-colors bg-slate-50 rounded-lg hover:bg-red-50"
                                                                        title="Hapus penilaian ini"
                                                                    >
                                                                        {Trash2 && <Trash2 size={18} />}
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>
                );
            };

            // Inisialisasi React
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        })();
    </script>
</body>
</html>
